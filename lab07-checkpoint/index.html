<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Aluno — Ibmec</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 { margin-bottom: 24px; }
    .campo {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }
    label {
      font-weight: bold;
      margin-bottom: 4px;
    }
    input, select {
      padding: 8px;
      font-size: 1rem;
      border: 1px solid #aaa;
      border-radius: 4px;
    }
    .dica {
      font-size: 0.85rem;
      color: #555;
      margin-top: 4px;
    }
    fieldset {
      border: 1px solid #aaa;
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    legend {
      font-weight: bold;
      padding: 0 6px;
    }
    .opcao-radio {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .aceite {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .botoes {
      display: flex;
      gap: 12px;
    }
    button[type="submit"] {
      background-color: #1a56db;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button[type="reset"] {
      background-color: #e5e7eb;
      color: #222;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { opacity: 0.88; }

    #aria-live-region {
      margin-top: 16px;
      color: #b91c1c;
      font-weight: bold;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <h1>Cadastro de Aluno</h1>

  <form id="form-cadastro">

    <!-- Nome -->
    <div class="campo">
      <label for="nome">Nome completo</label>
      <input
        type="text"
        id="nome"
        name="nome"
        required
        autocomplete="name"
        placeholder="Ex: Julia Dumont"
      >
    </div>

    <!-- E-mail -->
    <div class="campo">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        name="email"
        required
        autocomplete="email"
        placeholder="Ex: seuemail@email.com"
        aria-describedby="dica-email"
      >
      <span id="dica-email" class="dica">Use um e-mail válido no formato usuario@dominio.com</span>
    </div>

    <!-- CPF -->
    <div class="campo">
      <label for="cpf">CPF</label>
      <input
        type="text"
        id="cpf"
        name="cpf"
        required
        inputmode="numeric"
        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
        maxlength="14"
        placeholder="000.000.000-00"
        aria-describedby="dica-cpf"
      >
      <span id="dica-cpf" class="dica">Formato: 000.000.000-00 (somente números)</span>
    </div>

    <!-- Data de nascimento -->
    <div class="campo">
      <label for="nascimento">Data de nascimento</label>
      <input
        type="date"
        id="nascimento"
        name="nascimento"
        required
        aria-describedby="dica-nascimento"
      >
      <span id="dica-nascimento" class="dica">Informe sua data de nascimento no formato dd/mm/aaaa</span>
    </div>

    <!-- Curso -->
    <div class="campo">
      <label for="curso">Curso</label>
      <select id="curso" name="curso" required>
        <option value="">Selecione um curso</option>
        <option value="ads">Análise e Desenvolvimento de Sistemas</option>
        <option value="cc">Ciência da Computação</option>
        <option value="ec">Engenharia de Computação</option>
        <option value="si">Sistemas de Informação</option>
        <option value="des">Desenvolvimento Web</option>
      </select>
    </div>

    <!-- Turno -->
    <fieldset>
      <legend>Turno</legend>

      <div class="opcao-radio">
        <input type="radio" id="manha" name="turno" value="manha" required>
        <label for="manha">Manhã</label>
      </div>

      <div class="opcao-radio">
        <input type="radio" id="tarde" name="turno" value="tarde">
        <label for="tarde">Tarde</label>
      </div>

      <div class="opcao-radio">
        <input type="radio" id="noite" name="turno" value="noite">
        <label for="noite">Noite</label>
      </div>
    </fieldset>

    <!-- Aceite de termos -->
    <div class="aceite">
      <input type="checkbox" id="termos" name="termos" required>
      <label for="termos">Li e aceito os <a href="#">termos de uso e política de privacidade</a></label>
    </div>

    <!-- Botões -->
    <div class="botoes">
      <button type="submit">Enviar cadastro</button>
      <button type="reset">Limpar</button>
    </div>

  </form>

</body>
</html>
